name: Deploy DocNexa Admin Edge Function

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/docnexa-admin/**"
      - ".github/workflows/deploy-docnexa-admin.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docnexa-admin to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub repository secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy docnexa-admin --project-ref xayptkukxsmogxsnpnpa --no-verify-jwt --yes
